apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: apps
  namespace: flux-system

spec:
  interval: 1m

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  path: ./apps/frontend

  prune: true

  wait: true

  timeout: 5m

  targetNamespace: default
